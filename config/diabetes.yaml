# =========================================================================
# DIABETES / PANCREATIC DIFFERENTIATION PERTURB-SEQ
#
# Temporary presentation-safe configuration:
#   - Uses genotype as biological perturbation
#   - WT is control
#   - celltype_2 is curated cell-state annotation
#   - orig.ident is used for sample-aware enrichment
#   - lochNESS TEMPORARILY DISABLED because genotype "TET1/2/3" generates
#     an HDF5-unsafe obs column name: lochness_TET1/2/3
#
# Dataset:
#   111,581 cells
#   36,601 genes/features
#   37 genotypes including WT
#   36 non-WT perturbations
#   100 sgRNA constructs
#   15 cell states
#   13 samples
# =========================================================================


run:
  name: Diabetes_Pancreatic_Differentiation
  outdir: results/diabetes
  seed: 0


# -------------------------------------------------------------------------
# MULTI-SAMPLE METADATA
#
# Sample identity already exists in obs["orig.ident"].
# Do not require a separate external metadata CSV/TSV.
# -------------------------------------------------------------------------
metadata:
  file: null
  require_for_multilane: false


# -------------------------------------------------------------------------
# INPUT
#
# genotype = biological perturbation identity
#
# Examples:
#   WT
#   PDX1
#   MNX1
#   FOXA1
#   FOXA2
#   NKX2-2
#   RFX6
#   TET1/2/3
#
# sgrna/gene instead contain individual construct IDs.
# -------------------------------------------------------------------------
input:
  mode: h5ad
  h5ad: ../data/diabetes.h5ad
  guide_obs_column: genotype


# -------------------------------------------------------------------------
# SCALING
# -------------------------------------------------------------------------
scaling:
  mode: auto

  large_n_cells: 1000000
  large_n_perturbations: 5000

  marker_max_cells: 111581

  effect_gene_chunk: 256

  guide_chunk_size: 20000
  guide_max_dense_elements: 20000000

  collect_between_stages: true
  log_memory: true

  report_preview_rows: 500


# -------------------------------------------------------------------------
# PERTURBATION / CONTROL ASSIGNMENT
#
# WT is interpreted as the control population.
# -------------------------------------------------------------------------
guides:
  target_split_delims: []

  ntc_label: ntc

  ntc_patterns:
    - "^WT$"


# -------------------------------------------------------------------------
# QC
#
# Dataset already underwent upstream QC.
# Do not impose additional filtering.
# -------------------------------------------------------------------------
qc:
  min_genes_per_cell: null

  min_cells_per_gene: null

  min_genes_final: null

  max_pct_mt: null

  max_pct_hb: null

  min_counts_per_cell: null


# -------------------------------------------------------------------------
# PCA / CLUSTERING
#
# Existing H5AD contains X_umap but not X_pca.
# Generate PCA because Distance/DistanceSpace need continuous geometry.
#
# Do NOT batch-correct by orig.ident because samples represent genuine
# differentiation stages and states.
# -------------------------------------------------------------------------
cluster:
  n_top_genes: 3000

  n_pcs: 50

  n_neighbors: 15

  leiden_resolution: 1.0

  batch_key: null


# -------------------------------------------------------------------------
# DIRECT PERTURBATION EFFECT
#
# Each genotype is compared against WT.
#
# Some experimental labels are not literal single-gene symbols:
#   GATA6het
#   GATA4het
#   HNF4Ahet
#   PDX1het
#   NANOGe-het
#   HHEXe
#   ONECUT1e
#   QSER1TET1
#   TET1/2/3
#
# They remain valid phenotype perturbations even where direct target-gene
# expression cannot be mapped cleanly.
# -------------------------------------------------------------------------
perturbation:
  controls:
    - ntc
    - other

  primary_control: ntc

  min_cells_per_target: 10

  min_control_cells: 10

  min_pct_expressing_control: 1.0

  fdr_alpha: 0.05

  max_log2fc_for_hit: 0.0

  top_n_report: 12

  umap_background_fraction: 0.05


# -------------------------------------------------------------------------
# CELL-STATE ENRICHMENT
#
# Use curated pancreatic differentiation annotation:
#   obs["celltype_2"]
#
# Use orig.ident for stratification.
#
# Do NOT use time_point because all non-WT perturbation cells have
# time_point = NA.
# -------------------------------------------------------------------------
enrichment:
  enabled: true

  cluster_key: celltype_2

  controls:
    - ntc
    - other

  primary_control: ntc

  fdr_alpha: 0.05

  min_cells_per_target: 10

  min_cells_per_cluster: 20

  min_reference_cells: 10

  guide_concordance: false

  stratify_by: orig.ident

  permutations: 1000

  top_n_report: 12


# -------------------------------------------------------------------------
# STAGE 7:
# CO-FUNCTIONAL PERTURBATION MODULES + GENE PROGRAMS
#
# 36 non-WT perturbations:
#   6 perturbation modules
#   4 downstream gene programs
#
# celltype_2 marker genes are used as the biologically meaningful starting
# feature set.
# -------------------------------------------------------------------------
modules:
  enabled: true

  cluster_key: celltype_2

  gene_selection: cluster_markers

  n_marker_genes_per_cluster: 100

  marker_method: wilcoxon

  min_cells_per_perturbation: 20

  control: ntc

  program_correlation: pearson

  module_correlation: spearman

  linkage_method: average

  n_programs: 4

  n_modules: 6

  cluster_distance_threshold: 0.7

  score_programs: true

  hub_lfc_threshold: 0.5

  de_fdr_alpha: 0.05

  draw_networks: true

  min_perturbations: 3

  min_genes: 10

  top_n_report: 12

  # -----------------------------------------------------------------------
  # PROGRAM PATHWAY ENRICHMENT
  #
  # These keys match the ACTUAL schema reported by config.py.
  # -----------------------------------------------------------------------
  program_enrichment:
    enabled: true

    method: ora

    species: human

    sources:
      - hallmark
      - reactome
      - go_bp

    fdr_alpha: 0.05

    min_genes: 5

    max_genes: 500

    min_overlap: 2

    custom_gmt_files: []

    top_terms_per_program: 5


# -------------------------------------------------------------------------
# PERTURBATION SCORE
#
# Per-cell transcriptional response / penetrance.
# -------------------------------------------------------------------------
ps_score:
  enabled: true

  top_n_biomarkers: 100

  scale_factor: 3.0

  ps_threshold: 0.5

  expression_cut: mean

  expression_cut_quantile: 0.75

  min_cells_per_target: 10

  min_control_cells: 10

  top_n_report: 12

  compute_lda_umap: false


# -------------------------------------------------------------------------
# lochNESS
#
# TEMPORARILY DISABLED.
#
# Why:
#
# One biological perturbation is literally named:
#
#     TET1/2/3
#
# The current lochNESS implementation creates per-target obs columns such as:
#
#     lochness_TET1/2/3
#
# HDF5 interprets "/" as a path separator and AnnData therefore fails during
# Stage 13 when writing the final H5AD.
#
# This is an OUTPUT-SERIALIZATION bug, not a failure of the biological
# analysis.
#
# Disable lochNESS for the presentation run. Restore it after sanitizing
# target-derived H5AD column names in the writer.
# -------------------------------------------------------------------------
lochness:
  enabled: false

  genotype_key: target_gene

  n_neighbors: 300

  n_pcs: 20

  recompute_neighbors: true

  min_cells_per_target: 10

  enrichment_cut: 0.5

  noise_delta: 0.0

  target_chunk_size: 64

  store_all_target_scores: false

  max_targets_in_obs: 1

  top_n_report: 12


# -------------------------------------------------------------------------
# DISTANCE / DISTANCETEST
#
# Test whether each perturbation causes a significant global transcriptional
# phenotype relative to WT.
#
# Use X_pca, not UMAP.
# -------------------------------------------------------------------------
distance:
  enabled: true

  representation: X_pca

  primary_metric: edistance

  secondary_metric: null

  min_cells: 10

  max_cells_per_target: 2000

  max_control_cells: 5000

  n_permutations: 1000

  random_seed: 123

  fdr_threshold: 0.05


# -------------------------------------------------------------------------
# DISTANCESPACE
#
# 36 non-WT perturbations:
#
#   36 x 35 / 2 = 630 pairwise perturbation comparisons
#
# Computationally very manageable.
# -------------------------------------------------------------------------
distance_space:
  enabled: true

  metric: edistance

  representation: X_pca

  n_components: 10

  nearest_neighbors: 10

  clustering: true

  linkage_method: average

  min_cells: 10

  max_cells_per_target: 2000

  random_seed: 123


# -------------------------------------------------------------------------
# REPORT
# -------------------------------------------------------------------------
report:
  title: "Perturb-seq report — Diabetes pancreatic differentiation"

  embed_figures: true

  figure_format: png

  figure_dpi: 150

  max_table_rows: 100


# -------------------------------------------------------------------------
# OUTPUT
#
# Archive remains disabled.
# -------------------------------------------------------------------------
output:
  h5ad_name: diabetes_processed.h5ad

  report_name: report.html

  write_unfiltered_h5ad: false

  merge_guides_into_h5ad: true

  write_guide_h5ad: false

  archive: false


# -------------------------------------------------------------------------
# COMPUTE
#
# Recommended SLURM:
#
#   --cpus-per-task=48
#   --mem=256G
#   --time=08:00:00
#
# No GPU required.
# -------------------------------------------------------------------------
compute:
  backend: cpu

  n_jobs: 32

  gpu_device: 0

  gpu_min_cells: 200000

  gpu_min_dense_elements: 50000000

  gpu_memory_fraction: 0.80

  cpu_parallel_backend: loky

  blas_threads_per_worker: 1

  perturbation_n_jobs: 32

  enrichment_n_jobs: 32

  distance_n_jobs: 32

  modules_n_jobs: 16

  lochness_n_jobs: 1

  log_backend_decisions: true
