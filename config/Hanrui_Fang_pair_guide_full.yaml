# Hanrui Fang pair-guide Perturb-seq: complete QC / clustering / ECDF / perturbation workflow.
# Pair assignment (guides.assignment_mode: pair) is the PRIMARY label set; the single-guide rule is
# computed only as a diagnostic (guides.single_guide_diagnostic). Pipeline defaults elsewhere;
# advanced modules disabled; no Harmony (cluster.batch_key: null). Per-sample runs use
#   perturbseq-pipeline run -c <this> --lane HF011A          -> results/Hanrui_Fang_pair_guide_full/samples/HF011A
# and the combined run
#   perturbseq-pipeline run -c <this> --combined-subdir combined -> results/Hanrui_Fang_pair_guide_full/combined
run:
  name: Hanrui_Fang_pair_guide_full
  outdir: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full
  seed: 0
  stop_after: null
input:
  mode: mtx
  mtx_dirs:
    HF011A: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/outputs/hanrui_fang_inputs/cellranger/HF011A/filtered_feature_bc_matrix
    HF011B: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/outputs/hanrui_fang_inputs/cellranger/HF011B/filtered_feature_bc_matrix
    HF012A: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/outputs/hanrui_fang_inputs/cellranger/HF012A/filtered_feature_bc_matrix
    HF012B: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/outputs/hanrui_fang_inputs/cellranger/HF012B/filtered_feature_bc_matrix
  guide_mtx_dirs:
    HF011A: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full/inputs/guide_counts/HF011A
    HF011B: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full/inputs/guide_counts/HF011B
    HF012A: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full/inputs/guide_counts/HF012A
    HF012B: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full/inputs/guide_counts/HF012B
  h5ad: null
  guide_h5ad: null
  guide_obs_column: null
  feature_type_column: feature_types
  gex_feature_type: Gene Expression
  guide_feature_types: [CRISPR Guide Capture]
  var_names: gene_symbols
  cache_mtx: false
  cell_id_format: prefix            # <well>_<barcode>: unique, sample-prefixed cell ids
  counts_layer: null
  normalized_layer: null
  guide_table: null
metadata:
  file: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/config/Hanrui_fang_sample_manifest.csv
  key_column: lane_id
  require_for_multilane: true
qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  min_genes_final: 1000
  max_pct_mt: 20.0
  max_pct_hb: null
  min_counts_per_cell: null
  mito_prefix: MT-
  ribo_prefix: [RPS, RPL]
  hb_pattern: ^HB[^(P)]
guides:
  assignment_mode: pair             # pair-guide assignment is the primary analysis
  pair_assignment_primary: true
  pair_reference: /local/projects-t3/lilab/vmenon/PertTF-Virtual-Challeng-Weilab/perturbseq-pipeline/results/Hanrui_Fang_pair_guide_full/audit/pair_guide_reference.csv
  scaffold_column: auto
  sequence_column: auto
  pair_id_column: auto
  scaffold_classes: [A, C]
  require_complete_pair: true
  unresolved_pair_policy: exclude
  ntc_partner_policy: ambiguous     # targeting+NTC pairs are NOT assigned to the target (excluded from primary testing)
  single_guide_diagnostic: true     # diagnostic columns only
  min_umi: 3
  dominance_ratio: 2.0
  max_second_umi: -1
  detection_threshold: 3
  target_feature_column: null       # targets come from the pair reference
  target_split_delims: []
  ntc_label: ntc
cluster:
  target_sum: null
  n_top_genes: 3000
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  umap_min_dist: 0.5
  batch_key: null                   # no Harmony / batch correction
  regress_out: []
  assigned_only: false
perturbation:
  controls: [ntc, other]
  primary_control: ntc
  min_cells_per_target: 10
  min_control_cells: 10
  fdr_alpha: 0.05
  max_log2fc_for_hit: 0.0
enrichment:
  enabled: true
  primary_control: ntc
  stratify_by: null
  guide_concordance: true
modules:
  enabled: false                    # co-functional modules / gene programs off
ps_score:
  enabled: false
lochness:
  enabled: false
distance:
  enabled: false                    # energy distance / MMD off
distance_space:
  enabled: false
meta_analysis:
  enabled: false
visualization:
  perturbation_atlas: false
  ps_distance_map: false
  perturbation_space: false
  module_concordance: false
compute:
  n_jobs: 32
report:
  title: Hanrui Fang pair-guide Perturb-seq analysis
output:
  h5ad_name: Hanrui_Fang_pair_guide_processed.h5ad
  report_name: report.html
  write_unfiltered_h5ad: true
  unfiltered_h5ad_name: Hanrui_Fang_pair_guide_all_cells.h5ad
  merge_guides_into_h5ad: true
  guide_obsm_key: guide_counts
  write_guide_h5ad: false
  write_guide_table: true
  guide_table_min_umi: 3
  large_file_dir: null
