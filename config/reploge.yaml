run:
  name: ReplogleWeissman2022_K562_essential
  outdir: results/replogle
  seed: 0

input:
  mode: h5ad
  h5ad: ../data/ReplogleWeissman2022_K562_essential.h5ad
  guide_obs_column: gene

# -------------------------------------------------------------------------
# Scaling
# Replogle (~300k cells, ~1,800 perturbations) remains STANDARD under the
# centralized auto-scaling rules.
#
# STANDARD/LARGE controls biological/data scaling behavior and is independent
# of CPU/GPU execution.
# -------------------------------------------------------------------------
scaling:
  mode: auto
  large_n_cells: 1000000
  large_n_perturbations: 5000

  marker_max_cells: 200000
  effect_gene_chunk: 256

  guide_chunk_size: 20000
  guide_max_dense_elements: 20000000

  collect_between_stages: true
  log_memory: true

  report_preview_rows: 500

# -------------------------------------------------------------------------
# Guide labels
# Replogle already supplies target labels in obs["gene"], so do not parse
# gene names using delimiters.
# -------------------------------------------------------------------------
guides:
  target_split_delims: []
  ntc_label: ntc
  ntc_patterns:
    - "non-targeting"

# -------------------------------------------------------------------------
# QC
# Preserve the already-preprocessed Replogle object rather than imposing
# arbitrary new cell/gene filters.
# -------------------------------------------------------------------------
qc:
  min_genes_per_cell: null
  min_cells_per_gene: null
  min_genes_final: null
  max_pct_mt: null
  max_pct_hb: null
  min_counts_per_cell: null

# -------------------------------------------------------------------------
# Clustering
# PCA / neighbors / UMAP may use GPU automatically when the backend decides
# the operation is sufficiently large and compatible.
# -------------------------------------------------------------------------
cluster:
  n_top_genes: 3000
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  batch_key: batch

# -------------------------------------------------------------------------
# Direct perturbation efficacy
# -------------------------------------------------------------------------
perturbation:
  controls:
    - ntc
    - other

  primary_control: ntc

  min_cells_per_target: 10
  min_control_cells: 10
  min_pct_expressing_control: 1.0

  fdr_alpha: 0.05
  max_log2fc_for_hit: 0.0

  top_n_report: 12
  umap_background_fraction: 0.1

# -------------------------------------------------------------------------
# Perturbation enrichment across transcriptional states
# -------------------------------------------------------------------------
enrichment:
  enabled: true
  cluster_key: leiden

  controls:
    - ntc
    - other

  primary_control: ntc

  fdr_alpha: 0.05
  min_cells_per_target: 10
  min_cells_per_cluster: 20
  min_reference_cells: 10

  # The current Replogle input contains target labels rather than reliable
  # individual-guide identities for guide-level concordance.
  guide_concordance: false

  stratify_by: batch
  permutations: 1000

  top_n_report: 12

# -------------------------------------------------------------------------
# Co-functional perturbation modules / co-regulated gene programs
#
# Keep fewer workers here than Distance because effect-matrix construction,
# correlations, linkage and program scoring can have substantially larger
# per-worker memory requirements.
# -------------------------------------------------------------------------
modules:
  enabled: true

  cluster_key: leiden

  gene_selection: cluster_markers
  n_marker_genes_per_cluster: 100
  marker_method: wilcoxon

  min_cells_per_perturbation: 20

  control: ntc

  program_correlation: pearson
  module_correlation: spearman
  linkage_method: average

  # Exploratory hierarchical cuts; not fixed biological truths.
  n_programs: 4
  n_modules: 9
  cluster_distance_threshold: 0.7

  score_programs: true

  hub_lfc_threshold: 0.5
  de_fdr_alpha: 0.05

  draw_networks: true

  min_perturbations: 5
  min_genes: 10

  top_n_report: 12

  program_enrichment:
    enabled: true
    method: ora
    species: human
    sources:
      - hallmark
      - reactome
      - go_bp
    fdr_alpha: 0.05
    min_overlap: 2
    top_terms_per_program: 5

# -------------------------------------------------------------------------
# Perturbation Score
#
# Keep PS itself enabled.
# Supervised LDA/UMAP remains disabled because it is very expensive across
# ~1,800 perturbations and is not required for PS statistics.
# -------------------------------------------------------------------------
ps_score:
  enabled: true

  top_n_biomarkers: 100
  scale_factor: 3.0

  ps_threshold: 0.5

  expression_cut: mean
  expression_cut_quantile: 0.75

  min_cells_per_target: 10
  min_control_cells: 10

  top_n_report: 12

  compute_lda_umap: false

# -------------------------------------------------------------------------
# lochNESS
#
# lochNESS is primarily vectorized / Numba-oriented. Avoid a large external
# process pool here because nested process/thread parallelism can increase
# memory pressure without useful scaling.
# -------------------------------------------------------------------------
lochness:
  enabled: true

  genotype_key: target_gene

  n_neighbors: 300
  n_pcs: 20

  recompute_neighbors: true

  min_cells_per_target: 10
  enrichment_cut: 0.5

  noise_delta: 0.0

  top_n_report: 12

# -------------------------------------------------------------------------
# Perturbation Distance & Permutation DistanceTest — Stage 10
#
# The optimized implementation shares X_pca via file-backed np.memmap and
# passes indices rather than AnnData objects to workers.
# -------------------------------------------------------------------------
distance:
  enabled: true

  representation: X_pca
  primary_metric: edistance
  secondary_metric: null

  min_cells: 10

  max_cells_per_target: 2000
  max_control_cells: 5000

  n_permutations: 1000

  random_seed: 123
  fdr_threshold: 0.05

# -------------------------------------------------------------------------
# Perturbation DistanceSpace — Stage 11
#
# ENABLED FOR THIS RUN.
#
# ~1,800 perturbations correspond to ~1.62 million unique perturbation pairs.
# This will probably be the largest new computational workload in this run.
#
# Pairwise Energy Distance remains exact and uses bounded target-cell
# sampling. DistanceSpace mathematics was verified unchanged by the
# optimization.
# -------------------------------------------------------------------------
distance_space:
  enabled: true

  metric: edistance
  representation: X_pca

  n_components: 10
  nearest_neighbors: 10

  clustering: true
  linkage_method: average

  min_cells: 10
  max_cells_per_target: 2000

  random_seed: 123

# -------------------------------------------------------------------------
# Report
# -------------------------------------------------------------------------
report:
  title: "Perturb-seq report — Replogle K562 Essential"
  embed_figures: true
  figure_format: png
  figure_dpi: 150
  max_table_rows: 100

# -------------------------------------------------------------------------
# Outputs
# -------------------------------------------------------------------------
output:
  h5ad_name: ReplogleWeissman2022_K562_essential_processed.h5ad
  report_name: report.html

  write_unfiltered_h5ad: false

  merge_guides_into_h5ad: true
  write_guide_h5ad: false

  archive: true

# -------------------------------------------------------------------------
# Compute Execution Layer
#
# SLURM allocation for this run:
#
#   CPUs allocated : 128
#   RAM allocated  : 600 GB
#   GPU            : 1 × H200
#
# Do NOT use all 128 CPUs as workers.
#
# 96 general workers leaves ~32 CPUs of headroom for:
#   - parent/orchestrator process
#   - I/O
#   - HDF5 / memmap operations
#   - GPU feeder work
#   - OS/runtime activity
#
# Different biological modules intentionally receive different worker caps.
# -------------------------------------------------------------------------
compute:
  backend: auto

  # General upper bound for CPU-parallel stages.
  n_jobs: 96

  gpu_device: 0

  # Replogle exceeds this cell threshold, allowing compatible operations
  # such as large PCA/neighbors calculations to consider GPU execution.
  gpu_min_cells: 200000

  # Avoid moving small dense operations to GPU where transfer overhead
  # dominates.
  gpu_min_dense_elements: 50000000

  # Leave ~20% H200 memory as safety margin.
  gpu_memory_fraction: 0.80

  cpu_parallel_backend: loky

  # Critical with large process pools:
  # 96 workers × 1 BLAS thread, not 96 workers × multithreaded BLAS.
  blas_threads_per_worker: 1

  # -----------------------------------------------------------------------
  # Stage-specific CPU worker allocation
  # -----------------------------------------------------------------------

  # Perturbation-level efficacy calculations are highly independent across
  # targets and comparatively lightweight per worker.
  perturbation_n_jobs: 96

  # Cluster-enrichment calculations are also largely target-wise independent.
  enrichment_n_jobs: 96

  # DistanceTest and DistanceSpace have the largest amount of embarrassingly
  # parallel work. Replogle DistanceSpace has ~1.62M perturbation pairs.
  #
  # Use the full 96-worker process pool here.
  distance_n_jobs: 96

  # Module construction includes effect matrices, correlations and clustering.
  # Reduce process count to limit simultaneous matrix copies/intermediates and
  # therefore memory-bandwidth/RAM pressure.
  modules_n_jobs: 48

  # lochNESS already relies on efficient vectorized / compiled operations.
  # Avoid nested multiprocessing.
  lochness_n_jobs: 1

  log_backend_decisions: true