run:
  name: K562_320K_CRISPRi
  outdir: results/k562_320k_crispri
  seed: 0


# -------------------------------------------------------------------------
# INPUT
# -------------------------------------------------------------------------
input:
  mode: h5ad
  h5ad: ../data/K562_320K_CRISPR_filtered.h5ad

  feature_type_column: feature_types
  gex_feature_type: "Gene Expression"

  guide_feature_types:
    - "CRISPR Guide Capture"

  counts_layer: counts
  normalized_layer: null

  guide_obs_column: null
  guide_h5ad: null
  guide_table: null


# -------------------------------------------------------------------------
# SCALING
# -------------------------------------------------------------------------
scaling:
  mode: auto

  large_n_cells: 1000000
  large_n_perturbations: 5000

  marker_max_cells: 200000
  effect_gene_chunk: 256

  guide_chunk_size: 20000
  guide_max_dense_elements: 20000000

  collect_between_stages: true
  log_memory: true
  report_preview_rows: 500


# -------------------------------------------------------------------------
# GUIDE CALLING & TARGET RESOLUTION
# -------------------------------------------------------------------------
guides:
  min_umi: 3
  dominance_ratio: 2.0
  max_second_umi: -1
  detection_threshold: 3

  target_feature_column: target_gene_name

  ignored_target_values:
    - Ignore

  target_regex: null
  target_split_delims: []

  ntc_label: ntc

  ntc_patterns:
    - "^non[-_. ]?targeting"
    - "^non$"
    - "^ntc"
    - scramble
    - "^safe[-_. ]?harbor"

  unassigned_label: unassigned
  ambiguous_label: ambiguous


# -------------------------------------------------------------------------
# QC
# -------------------------------------------------------------------------
qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  min_genes_final: 1000

  max_pct_mt: 20.0
  max_pct_hb: null
  min_counts_per_cell: null

  mito_prefix: "MT-"

  ribo_prefix:
    - "RPS"
    - "RPL"

  hb_pattern: "^HB[^(P)]"


# -------------------------------------------------------------------------
# CLUSTERING
# -------------------------------------------------------------------------
cluster:
  target_sum: null

  n_top_genes: 3000
  n_pcs: 50
  n_neighbors: 15

  leiden_resolution: 1.0
  umap_min_dist: 0.5

  batch_key: null
  regress_out: []

  scale_max_value: 10.0
  assigned_only: false


# -------------------------------------------------------------------------
# DIRECT PERTURBATION EFFICACY
# -------------------------------------------------------------------------
perturbation:
  controls:
    - ntc
    - other

  primary_control: ntc

  min_cells_per_target: 10
  min_control_cells: 10

  min_pct_expressing_control: 1.0

  fdr_alpha: 0.05
  max_log2fc_for_hit: 0.0

  top_n_report: 12

  umap_background_fraction: 0.01


# -------------------------------------------------------------------------
# CELL-STATE / CLUSTER ENRICHMENT
#
# This is perturbation enrichment across Leiden states.
# It is separate from Stage 7 pathway enrichment.
# -------------------------------------------------------------------------
enrichment:
  enabled: true

  cluster_key: leiden

  controls:
    - ntc
    - other

  primary_control: ntc

  fdr_alpha: 0.05

  min_cells_per_target: 10
  min_cells_per_cluster: 20
  min_reference_cells: 10

  odds_pseudocount: 0.5

  stratify_by: null

  guide_concordance: true
  min_cells_per_guide: 5

  permutations: 1000

  top_n_report: 12


# -------------------------------------------------------------------------
# CO-FUNCTIONAL MODULES / GENE PROGRAMS — STAGE 7
#
# Produces:
#
#   perturbation × downstream-gene effects
#                 ↓
#       M1..M9 perturbation modules
#       P1..P4 gene programs
#                 ↓
#       module × program effects
#                 ↓
#       pathway enrichment of P programs
#                 ↓
#       biological annotations
#
# The stable P1/P2/... identifiers remain authoritative.
# Biological labels are annotations only.
# -------------------------------------------------------------------------
modules:
  enabled: true

  cluster_key: leiden

  gene_selection: cluster_markers
  n_marker_genes_per_cluster: 100
  marker_method: wilcoxon

  min_cells_per_perturbation: 20

  control: ntc

  program_correlation: pearson
  module_correlation: spearman

  linkage_method: average

  n_programs: 4
  n_modules: 9

  cluster_distance_threshold: 0.7

  score_programs: true

  hub_lfc_threshold: 0.5
  de_fdr_alpha: 0.05

  draw_networks: false

  min_perturbations: 5
  min_genes: 10

  top_n_report: 12

  # -----------------------------------------------------------------------
  # BIOLOGICAL PATHWAY ANNOTATION OF P1/P2/P3/P4
  #
  # Uses ORA after program discovery.
  #
  # Background:
  #   genes actually eligible/included in the Stage 7 effect matrix.
  #
  # Full enrichment stays external:
  #   tables/program_enrichment.csv
  #   tables/program_summary.csv
  #
  # Existing per-cell program scores remain in H5AD.
  # -----------------------------------------------------------------------
  program_enrichment:
    enabled: true

    method: ora

    fdr_threshold: 0.05

    # Skip programs too small for meaningful ORA.
    min_genes: 5

    # Safety bound for abnormally broad programs.
    max_genes: 500

    gene_set_sources:
      - hallmark
      - reactome
      - go_bp

    # Optional external GMT; disabled for this production run.
    custom_gmt_path: null

    species: human

    top_n_terms_summary: 5


# -------------------------------------------------------------------------
# PERTURBATION SCORE
# -------------------------------------------------------------------------
ps_score:
  enabled: true
  require: false

  top_n_biomarkers: 100

  scale_factor: 3.0
  ps_threshold: 0.5

  expression_cut: mean
  expression_cut_quantile: 0.75

  min_cells_per_target: 10
  min_control_cells: 10

  top_n_report: 12

  compute_lda_umap: false

  lda_n_pcs: 40
  lda_max_genes: 5000
  lda_highlight_threshold: 0.8

  lda_large_max_cells: 150000
  lda_large_stratified: true


# -------------------------------------------------------------------------
# lochNESS
# -------------------------------------------------------------------------
lochness:
  enabled: true

  genotype_key: target_gene

  n_neighbors: 300
  n_pcs: 20

  use_rep: null

  recompute_neighbors: true

  min_cells_per_target: 10

  enrichment_cut: 0.5
  noise_delta: 0.0

  target_chunk_size: 256

  store_all_target_scores: false

  # Schema requires >=1 even though full target-score storage is disabled.
  max_targets_in_obs: 1

  top_n_report: 12


# -------------------------------------------------------------------------
# DISTANCE / DISTANCETEST — STAGE 10
#
# Tests global perturbation phenotype relative to NTC.
# -------------------------------------------------------------------------
distance:
  enabled: true

  representation: X_pca

  primary_metric: edistance
  secondary_metric: null

  min_cells: 10

  max_cells_per_target: 2000
  max_control_cells: 5000

  n_permutations: 1000

  random_seed: 123

  fdr_threshold: 0.05


# -------------------------------------------------------------------------
# DISTANCESPACE — STAGE 11
#
# ~850 perturbations -> ~360,825 unique perturbation pairs.
# -------------------------------------------------------------------------
distance_space:
  enabled: true

  metric: edistance

  representation: X_pca

  n_components: 10

  nearest_neighbors: 10

  clustering: true

  linkage_method: average

  min_cells: 10

  max_cells_per_target: 2000

  random_seed: 123


# -------------------------------------------------------------------------
# REPORT
# -------------------------------------------------------------------------
report:
  title: "Perturb-seq report — 10x Flex K562 320K CRISPRi"

  embed_figures: true

  figure_format: png
  figure_dpi: 150

  max_table_rows: 100


# -------------------------------------------------------------------------
# OUTPUT
#
# H5AD:
#   cell-level state / scores / embeddings / program scores
#
# External:
#   perturbation summaries
#   module/program tables
#   pathway enrichment
#   Distance/DistanceSpace matrices
#   figures
#   HTML report
# -------------------------------------------------------------------------
output:
  h5ad_name: K562_320K_CRISPRi_processed.h5ad

  report_name: report.html

  write_unfiltered_h5ad: false
  unfiltered_h5ad_name: null

  merge_guides_into_h5ad: true
  guide_obsm_key: guide_counts

  write_guide_h5ad: false

  save_figures_pdf: false

  archive: false
  archive_name: null

  write_guide_table: false
  guide_table_name: null
  guide_table_min_umi: 3

  large_file_dir: null
  large_file_threshold_mb: 50.0


# -------------------------------------------------------------------------
# COMPUTE
#
# Intended SLURM allocation:
#
#   128 CPUs
#   600 GB RAM
#   1 × H200
#
# Global worker pool is capped at 96, leaving ~32 CPUs for orchestration,
# I/O, GPU feeding, HDF5/memmap handling and system overhead.
# -------------------------------------------------------------------------
compute:
  backend: auto

  n_jobs: 96

  gpu_device: 0

  gpu_min_cells: 200000
  gpu_min_dense_elements: 50000000

  gpu_memory_fraction: 0.80

  cpu_parallel_backend: loky

  blas_threads_per_worker: 1

  perturbation_n_jobs: 96

  enrichment_n_jobs: 96

  distance_n_jobs: 96

  modules_n_jobs: 48

  lochness_n_jobs: 1

  log_backend_decisions: true